# Builds a signed Android APK for installing on a test phone. Run it from the
# Actions tab ("Run workflow"); the APK is attached to the run for 3 days.
#
# Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64    the test signing key (chekkin-test.jks), base64
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key)
#   MAPS_API_KEY               the Maps SDK for Android key
name: Android test APK

on:
  workflow_dispatch:
    inputs:
      dev_tools:
        description: Include DEV_TOOLS (long-press teleport)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: checkin_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$MAPS_API_KEY" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and MAPS_API_KEY secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chekkin-test.jks"
          {
            echo "storeFile=$RUNNER_TEMP/chekkin-test.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=chekkin"
          } > android/key.properties

      - name: Build the APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=DEV_TOOLS=${{ inputs.dev_tools }}

      - uses: actions/upload-artifact@v5
        with:
          name: chekkin-test-apk-${{ github.run_number }}
          path: checkin_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error
